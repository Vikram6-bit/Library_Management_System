<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="navbar">
        <h1>Issue a Book</h1>
        <a href="{{ url_for('admin_dashboard') }}">← Dashboard</a>
    </div>

    <div class="container" style="max-width: 500px;">

        <div class="card">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash flash-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if books and members %}

            <form method="POST">

                <label>Book</label>
                <select name="book_id" required>
                    <option value="">-- Select a book --</option>
                    {% for book in books %}
                    <option value="{{ book.id }}">
                        {{ book.title }} ({{ book.available_copies }} available)
                    </option>
                    {% endfor %}
                </select>

                <label>Member</label>
                <select name="member_id" required>
                    <option value="">-- Select a member --</option>
                    {% for member in members %}
                    <option value="{{ member.id }}">
                        {{ member.name }} ({{ member.member_code }})
                    </option>
                    {% endfor %}
                </select>

                <label>Due in (days)</label>
                <input type="number" name="due_days" value="14" min="1" required>

                <button type="submit" class="btn">Issue Book</button>

            </form>

            {% else %}

            <p>No books available to issue, or no members registered yet.</p>

            {% endif %}

        </div>

    </div>

</body>
</html>
